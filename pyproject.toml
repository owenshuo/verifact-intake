[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verifact-intake"
version = "0.1.0"
description = "Evidence-linked document-to-ontology intake with human review"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "owenshuo" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pdfplumber>=0.11,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verifact_intake"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["verifact_intake"]

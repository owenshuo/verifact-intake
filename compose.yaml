services:
  verifact:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      VERIFACT_ENV: development
      VERIFACT_ASSET_ROOT: /app
      VERIFACT_DATABASE_URL: sqlite:////app/runtime/verifact.db
      VERIFACT_EXTRACTION_PROVIDER: ${VERIFACT_EXTRACTION_PROVIDER:-fixture}
      NUTRIENT_API_KEY: ${NUTRIENT_API_KEY:-}
      NUTRIENT_API_BASE_URL: ${NUTRIENT_API_BASE_URL:-https://api.nutrient.io}
      NUTRIENT_LIVE_MODE: ${NUTRIENT_LIVE_MODE:-false}
      NUTRIENT_CACHE_DIR: /app/runtime/nutrient-cache
      NUTRIENT_CACHE_ENABLED: ${NUTRIENT_CACHE_ENABLED:-true}
      NUTRIENT_CACHE_REFRESH: ${NUTRIENT_CACHE_REFRESH:-false}
      NUTRIENT_MAX_LIVE_CALLS: ${NUTRIENT_MAX_LIVE_CALLS:-3}
      NUTRIENT_ESTIMATED_CREDITS_PER_CALL: ${NUTRIENT_ESTIMATED_CREDITS_PER_CALL:-3}
      NUTRIENT_MAX_ESTIMATED_CREDITS: ${NUTRIENT_MAX_ESTIMATED_CREDITS:-9}
    volumes:
      - verifact-runtime:/app/runtime
    restart: unless-stopped

volumes:
  verifact-runtime:

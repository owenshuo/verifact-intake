<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">VeriFact Intake trust architecture</title>
  <desc id="desc">Three source documents are extracted by Nutrient DWS, compiled into evidence-linked assertions, checked by deterministic trust policy, reviewed when uncertain, and promoted into versioned effective facts with append-only audit proof.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#e8f5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d2847" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#557084"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102a48; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #52687a; }
      .step { font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; fill: #138f84; }
      .card-title { font: 700 22px Arial, sans-serif; fill: #102a48; }
      .card-copy { font: 400 15px Arial, sans-serif; fill: #52687a; }
      .small { font: 600 13px Arial, sans-serif; fill: #52687a; }
      .inverse-title { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .inverse-copy { font: 400 15px Arial, sans-serif; fill: #cbd9e4; }
      .proof-title { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .proof-copy { font: 400 15px Arial, sans-serif; fill: #bed0dd; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="url(#background)"/>
  <text class="title" x="60" y="68">From extracted content to trusted ontology facts</text>
  <text class="subtitle" x="60" y="101">The trust boundary prevents a parsed statement from silently becoming truth.</text>
  <rect x="1212" y="43" width="328" height="52" rx="26" fill="#102a48"/>
  <text x="1376" y="76" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#73d7ca">Assertion &#8800; EffectiveFact</text>

  <line x1="310" y1="292" x2="356" y2="292" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="292" x2="656" y2="292" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="292" x2="956" y2="292" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1210" y1="292" x2="1256" y2="292" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="250" height="284" rx="20" fill="#ffffff" stroke="#d8e5e4"/>
    <rect x="360" y="150" width="250" height="284" rx="20" fill="#ffffff" stroke="#d8e5e4"/>
    <rect x="660" y="150" width="250" height="284" rx="20" fill="#ffffff" stroke="#d8e5e4"/>
    <rect x="960" y="150" width="250" height="284" rx="20" fill="#102a48"/>
    <rect x="1260" y="150" width="280" height="284" rx="20" fill="#ffffff" stroke="#70cfc3" stroke-width="2"/>
  </g>

  <text class="step" x="86" y="190">01 · SOURCES</text>
  <text class="card-title" x="86" y="226">Business PDFs</text>
  <rect x="86" y="251" width="166" height="38" rx="8" fill="#edf5f4"/>
  <text class="small" x="102" y="275">API reference</text>
  <rect x="86" y="300" width="166" height="38" rx="8" fill="#edf5f4"/>
  <text class="small" x="102" y="324">Operations guide</text>
  <rect x="86" y="349" width="166" height="38" rx="8" fill="#edf5f4"/>
  <text class="small" x="102" y="373">Quality policy</text>
  <text class="card-copy" x="86" y="409">Immutable + SHA-256</text>

  <text class="step" x="386" y="190">02 · EXTRACT</text>
  <text class="card-title" x="386" y="226">Nutrient DWS</text>
  <circle cx="405" cy="270" r="8" fill="#19a99a"/>
  <text class="card-copy" x="425" y="276">JSON content</text>
  <circle cx="405" cy="307" r="8" fill="#19a99a"/>
  <text class="card-copy" x="425" y="313">Page locations</text>
  <circle cx="405" cy="344" r="8" fill="#19a99a"/>
  <text class="card-copy" x="425" y="350">Direct quotes</text>
  <rect x="386" y="377" width="194" height="34" rx="17" fill="#e0f4f1"/>
  <text x="483" y="399" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#087a71">LIVE · CACHE · FIXTURE</text>

  <text class="step" x="686" y="190">03 · COMPILE</text>
  <text class="card-title" x="686" y="226">Assertions</text>
  <text class="card-copy" x="686" y="268">Normalized fact key</text>
  <text class="card-copy" x="686" y="299">Typed value from evidence</text>
  <text class="card-copy" x="686" y="330">Source authority</text>
  <text class="card-copy" x="686" y="361">Evidence locator</text>
  <rect x="686" y="382" width="190" height="30" rx="8" fill="#fff3d6"/>
  <text x="781" y="402" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#986900">Claim, not truth</text>

  <text class="step" x="986" y="190" fill="#73d7ca">04 · CHALLENGE</text>
  <text class="inverse-title" x="986" y="226">Trust kernel</text>
  <text class="inverse-copy" x="986" y="268">Authority policy</text>
  <text class="inverse-copy" x="986" y="299">Conflict detection</text>
  <text class="inverse-copy" x="986" y="330">Promotion gates</text>
  <line x1="986" y1="353" x2="1180" y2="353" stroke="#49627c"/>
  <text x="986" y="382" style="font:700 14px Arial,sans-serif;fill:#73d7ca">UNCERTAIN?</text>
  <text class="inverse-copy" x="986" y="406">Route to human review</text>

  <text class="step" x="1286" y="190">05 · PROMOTE</text>
  <text class="card-title" x="1286" y="226">EffectiveFact</text>
  <text class="card-copy" x="1286" y="268">Versioned value</text>
  <text class="card-copy" x="1286" y="299">Source assertion IDs</text>
  <text class="card-copy" x="1286" y="330">Evidence retained</text>
  <text class="card-copy" x="1286" y="361">Portable ontology JSON</text>
  <rect x="1286" y="382" width="214" height="30" rx="8" fill="#e0f4f1"/>
  <text x="1393" y="402" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#087a71">Only after gates pass</text>

  <path d="M1085 434 L1085 486 L865 486 L865 527" fill="none" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1060 591 L1194 591 L1194 434" fill="none" stroke="#557084" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="690" y="527" width="370" height="128" rx="18" fill="#ffffff" stroke="#e5bf68" stroke-width="2"/>
  </g>
  <text class="step" x="718" y="562" fill="#986900">HUMAN REVIEW</text>
  <text class="card-title" x="718" y="594">Choose evidence, not a value</text>
  <text class="card-copy" x="718" y="626">Append approval/rejection decisions;</text>
  <text class="card-copy" x="718" y="648">never overwrite the source assertion.</text>

  <rect x="60" y="698" width="1480" height="82" rx="18" fill="#102a48"/>
  <text class="proof-title" x="88" y="733">Replayable proof plane</text>
  <text class="proof-copy" x="88" y="759">SQLite run state</text>
  <circle cx="314" cy="751" r="4" fill="#73d7ca"/>
  <text class="proof-copy" x="330" y="759">append-only review decisions</text>
  <circle cx="600" cy="751" r="4" fill="#73d7ca"/>
  <text class="proof-copy" x="616" y="759">hash-chained audit events</text>
  <circle cx="888" cy="751" r="4" fill="#73d7ca"/>
  <text class="proof-copy" x="904" y="759">ontology export</text>
  <rect x="1270" y="719" width="235" height="40" rx="20" fill="#173c5f" stroke="#73d7ca"/>
  <text x="1387" y="744" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#73d7ca">Evidence remains traceable</text>
</svg>

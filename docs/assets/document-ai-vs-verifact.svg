<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Document AI compared with VeriFact Intake</title>
  <desc id="desc">Document AI ends with extracted text or an answer. VeriFact continues through evidence-linked assertions, conflict detection, human review, versioned facts, and verifiable audit proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#e7f5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102a48" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b9cab"/>
    </marker>
    <marker id="arrow-trust" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#138f84"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102a48; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #52687a; }
      .lane { font: 700 23px Arial, sans-serif; fill: #102a48; }
      .label { font: 700 12px Arial, sans-serif; letter-spacing: 1.4px; }
      .card { font: 700 17px Arial, sans-serif; fill: #102a48; }
      .copy { font: 400 14px Arial, sans-serif; fill: #52687a; }
      .inverse-card { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .inverse-copy { font: 400 14px Arial, sans-serif; fill: #d1e2ea; }
    </style>
  </defs>

  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <text class="title" x="60" y="66">Extraction is useful. Operational truth needs a trust boundary.</text>
  <text class="subtitle" x="60" y="99">The difference is what happens after a document parser returns structured content.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="142" width="1480" height="190" rx="22" fill="#ffffff" stroke="#d9e3e8"/>
    <rect x="60" y="362" width="1480" height="274" rx="22" fill="#ffffff" stroke="#70cfc3" stroke-width="2"/>
  </g>

  <text class="label" x="92" y="180" fill="#6d7f8e">COMMON DOCUMENT AI</text>
  <text class="lane" x="92" y="216">Retrieve or answer</text>
  <rect x="332" y="183" width="170" height="88" rx="14" fill="#eef3f5"/>
  <text class="card" x="417" y="220" text-anchor="middle">PDFs</text>
  <text class="copy" x="417" y="245" text-anchor="middle">mixed authority</text>
  <line x1="502" y1="227" x2="558" y2="227" stroke="#8b9cab" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <rect x="566" y="183" width="190" height="88" rx="14" fill="#eef3f5"/>
  <text class="card" x="661" y="220" text-anchor="middle">Extract text</text>
  <text class="copy" x="661" y="245" text-anchor="middle">or embeddings</text>
  <line x1="756" y1="227" x2="812" y2="227" stroke="#8b9cab" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <rect x="820" y="183" width="210" height="88" rx="14" fill="#eef3f5"/>
  <text class="card" x="925" y="220" text-anchor="middle">Generate answer</text>
  <text class="copy" x="925" y="245" text-anchor="middle">confidence is not authority</text>
  <line x1="1030" y1="227" x2="1086" y2="227" stroke="#8b9cab" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <rect x="1094" y="183" width="380" height="88" rx="14" fill="#fff1e8" stroke="#efb28c"/>
  <text x="1284" y="218" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#9d4b22">Which source wins?</text>
  <text x="1284" y="245" text-anchor="middle" style="font:400 14px Arial,sans-serif;fill:#8a634f">The downstream agent must guess.</text>

  <text class="label" x="92" y="402" fill="#138f84">VERIFACT INTAKE</text>
  <text class="lane" x="92" y="438">Promote only evidence that passes governance</text>

  <rect x="92" y="472" width="172" height="100" rx="14" fill="#e9f4f2"/>
  <text class="card" x="178" y="510" text-anchor="middle">Nutrient DWS</text>
  <text class="copy" x="178" y="535" text-anchor="middle">page + evidence block</text>
  <text class="copy" x="178" y="555" text-anchor="middle">typed value derived</text>
  <line x1="264" y1="522" x2="306" y2="522" stroke="#138f84" stroke-width="3" marker-end="url(#arrow-trust)"/>

  <rect x="314" y="472" width="172" height="100" rx="14" fill="#e9f4f2"/>
  <text class="card" x="400" y="510" text-anchor="middle">Assertion</text>
  <text class="copy" x="400" y="535" text-anchor="middle">claim + provenance</text>
  <text class="copy" x="400" y="555" text-anchor="middle">not truth</text>
  <line x1="486" y1="522" x2="528" y2="522" stroke="#138f84" stroke-width="3" marker-end="url(#arrow-trust)"/>

  <rect x="536" y="472" width="188" height="100" rx="14" fill="#102a48"/>
  <text class="inverse-card" x="630" y="510" text-anchor="middle">Trust policy</text>
  <text class="inverse-copy" x="630" y="535" text-anchor="middle">authority + conflict</text>
  <text class="inverse-copy" x="630" y="555" text-anchor="middle">fail closed</text>
  <line x1="724" y1="522" x2="766" y2="522" stroke="#138f84" stroke-width="3" marker-end="url(#arrow-trust)"/>

  <rect x="774" y="472" width="174" height="100" rx="14" fill="#fff4d9" stroke="#e4bb5b"/>
  <text class="card" x="861" y="510" text-anchor="middle">Human review</text>
  <text class="copy" x="861" y="535" text-anchor="middle">compare exact quotes</text>
  <text class="copy" x="861" y="555" text-anchor="middle">append decision</text>
  <line x1="948" y1="522" x2="990" y2="522" stroke="#138f84" stroke-width="3" marker-end="url(#arrow-trust)"/>

  <rect x="998" y="472" width="182" height="100" rx="14" fill="#e9f4f2"/>
  <text class="card" x="1089" y="510" text-anchor="middle">EffectiveFact</text>
  <text class="copy" x="1089" y="535" text-anchor="middle">versioned value</text>
  <text class="copy" x="1089" y="555" text-anchor="middle">evidence retained</text>
  <line x1="1180" y1="522" x2="1222" y2="522" stroke="#138f84" stroke-width="3" marker-end="url(#arrow-trust)"/>

  <rect x="1230" y="472" width="244" height="100" rx="14" fill="#102a48"/>
  <text class="inverse-card" x="1352" y="510" text-anchor="middle">Verifiable proof</text>
  <text class="inverse-copy" x="1352" y="535" text-anchor="middle">hash-chained audit</text>
  <text class="inverse-copy" x="1352" y="555" text-anchor="middle">portable ontology export</text>

  <rect x="92" y="590" width="1382" height="28" rx="14" fill="#dff3ef"/>
  <text x="783" y="609" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#087a71">DWS makes evidence deterministic · VeriFact makes promotion governed · humans decide only where policy cannot</text>
</svg>
